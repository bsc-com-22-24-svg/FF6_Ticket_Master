<svg xmlns="http://www.w3.org/2000/svg" width="680" height="764" viewBox="0 0 680 764" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Sequence diagram: log in</title><desc>A visitor opens a protected page and is sent to the login page. The auth store checks the account. A wrong password or a disabled account shows an error. A valid account saves a session and the route guard checks the role before showing the page.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="764" fill="#FFFFFF"/><text x="340.0" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2C2C2A" text-anchor="middle">Figure A-2: Sequence diagram, log in</text><g transform="translate(0,44)"><line x1="68.0" y1="64.0" x2="68.0" y2="712.0" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
