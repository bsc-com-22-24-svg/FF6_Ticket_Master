name: ticket-docker

services:
  ticket-db:
    image: postgres:16
    container_name: ticket-db
    restart: unless-stopped
    env_file: .env.db
    ports:
      - "5433:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
      - ./event_ticket_booking_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_master"]
      interval: 3s
      timeout: 3s
      retries: 20

  ticket-backend:
    image: alicekayla/ticket-backend:1.4
    container_name: ticket-backend-app
    restart: unless-stopped
    env_file: .env.backend
    working_dir: /tmp
    entrypoint: ["node"]
    command: ["/app/dist/main"]
    ports:
      - "3000:3000"
    depends_on:
      ticket-db:
        condition: service_healthy
    volumes:
      - ticket-uploads:/app/uploads

volumes:
  ticket-db-data:
    external: true
    name: ticket-db-data
  ticket-uploads:
    name: ticket-docker_ticket-uploads
